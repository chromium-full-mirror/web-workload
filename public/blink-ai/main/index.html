<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blink AI Benchmark</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>Blink AI Benchmark</h1>
      <div class="subtitle">Prompt API E2E Performance</div>

      <div class="gauge-container">
        <svg class="gauge-svg" width="220" height="220" viewBox="0 0 220 220">
          <circle class="gauge-track" cx="110" cy="110" r="100"></circle>
          <circle class="gauge-fill" id="gauge-fill" cx="110" cy="110" r="100"></circle>
        </svg>

        <button id="start-button">Start</button>

        <div class="gauge-center">
          <div class="spinner" id="status-spinner"></div>
          <div class="gauge-value" id="gauge-value">--</div>
          <div class="gauge-label" id="gauge-label">Ready</div>
        </div>
      </div>

      <div class="status-text waiting" id="status-text">Click 'Start' to begin the benchmark</div>

      <div class="results-panel" id="results-panel">
        <div class="result-row global-row">
          <span class="result-label">Model Download</span>
          <span class="result-value" id="res-download">--</span>
        </div>
        <div id="story-results"></div>
      </div>
    </div>
  </div>

  <template id="story-card-template">
    <div class="story-card">
      <div class="story-header">
        <span class="story-name"></span>
        <span class="story-badge"></span>
      </div>
      <div class="story-metrics">
        <div class="result-row">
          <span class="result-label">Session Creation</span>
          <span class="result-value metric-session"></span>
        </div>
        <div class="result-row">
          <span class="result-label">Time to First Token (Cold)</span>
          <span class="result-value metric-ttft-cold"></span>
        </div>
        <div class="result-row">
          <span class="result-label">Time to First Token (Warm Avg)</span>
          <span class="result-value metric-ttft-warm"></span>
        </div>
        <div class="result-row">
          <span class="result-label">Total Prompt Time (Cold)</span>
          <span class="result-value metric-total-cold"></span>
        </div>
        <div class="result-row">
          <span class="result-label">Total Prompt Time (Warm Avg)</span>
          <span class="result-value metric-total-warm"></span>
        </div>
        <div class="result-row">
          <span class="result-label">Tokens Per Second (Warm Avg)</span>
          <span class="result-value metric-tps-warm"></span>
        </div>
      </div>
    </div>
  </template>

  <div style="display: none;">
    <img id="input-image-apple" src="../media/apple.jpg">
    <img id="input-image-orange" src="../media/orange.jpg">
    <img id="input-image-cat" src="../media/cat.jpg">
    <img id="input-image-strawberry" src="../media/strawberry.jpg">
    <audio id="input-audio-dream" src="../media/dream.mp3"></audio>
  </div>

  <script src="app.js"></script>
</body>
</html>
